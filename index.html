<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Strong at Home</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFAE6">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Strong at Home">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one calm column sized for a phone; one big action per screen, guided workout steps with a progress rail. */
:root{
  --bg:#FFFAE6; --surface:#FFFFFF; --sunk:#F7EFCB; --ink:#13302B; --muted:#55615A; --line:#ECE1B4;
  --accent:#0E6A62; --accent-ink:#FFFFFF; --accent-soft:#E3F1E6;
  --sun:#F9DE6B; --sun-soft:#FFF2B3;
  --z-easy:#3F84B8; --z-right:#1D8556; --z-hard:#CF7A22; --z-max:#BB4136;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16180F; --surface:#21231A; --sunk:#2C2D20; --ink:#F3F0DE; --muted:#B5B29A; --line:#3A3A2A;
  --accent:#55C7B8; --accent-ink:#0B1715; --accent-soft:#1D3B37;
  --sun:#F7DD72; --sun-soft:#3D3818;
  --z-easy:#6FAEDC; --z-right:#4FC287; --z-hard:#EBA05A; --z-max:#E8766A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16180F; --surface:#21231A; --sunk:#2C2D20; --ink:#F3F0DE; --muted:#B5B29A; --line:#3A3A2A;
  --accent:#55C7B8; --accent-ink:#0B1715; --accent-soft:#1D3B37;
  --sun:#F7DD72; --sun-soft:#3D3818;
  --z-easy:#6FAEDC; --z-right:#4FC287; --z-hard:#EBA05A; --z-max:#E8766A; color-scheme:dark}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2.1rem} h2{font-size:1.6rem} h3{font-size:1.2rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,a.btn{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:14px 22px;border-radius:16px;border:2px solid transparent;font-weight:700;font-size:1.1rem;text-decoration:none;text-align:center;width:100%}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-quiet{background:none;color:var(--accent);min-height:52px;text-decoration:underline;text-underline-offset:4px}
.btn:focus-visible,button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
header.top{display:flex;justify-content:space-between;align-items:center;padding-block:18px 8px}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--accent)}
.iconbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;min-height:48px;padding:0 18px;font-weight:700;font-size:.95rem}
/* Home hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero .eyebrow{color:var(--accent-ink);opacity:.85}
.hero h1{font-size:2.4rem}
.hero .btn-primary{background:var(--sun);color:#1B1A12}
.hero .meta{display:flex;gap:18px;flex-wrap:wrap;font-weight:700;opacity:.92}
.plates{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;border:22px solid var(--sun);opacity:.35;pointer-events:none}
.chip{background:var(--sun-soft)}
.notice{border:1px solid var(--sun)}
.weekstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wk{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:.85rem;text-align:center;min-width:0}
.wk .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--sunk);color:var(--muted)}
.wk.done .dot{background:var(--accent);color:var(--accent-ink)}
.wk.next{border:2px solid var(--accent)}
.wk.next .dot{background:var(--sun);color:#1B1A12}
.phasebar{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.phasebar span{height:12px;border-radius:4px;background:var(--sunk)}
.phasebar span.done{background:var(--accent)}
.phasebar span.now{background:var(--sun)}
.notice{background:var(--sun-soft);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
/* Workout */
.wtop{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-block:14px 12px;display:flex;flex-direction:column;gap:10px}
.rail{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.rail i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.wtop .row{justify-content:space-between;flex-wrap:nowrap}
.ex-name{font-size:2rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--sunk);border-radius:999px;padding:6px 14px;font-size:.95rem;font-weight:700}
.dose{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dose b{font-family:var(--display);font-size:2.6rem;line-height:1;color:var(--accent)}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.count{border:2px solid var(--accent);color:var(--accent);border-radius:12px;padding:6px 12px;font-weight:700}
.sets{display:flex;gap:12px;flex-wrap:wrap}
.set{width:64px;height:64px;border-radius:50%;border:3px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;font-size:1.05rem;display:grid;place-items:center}
.set[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:#1B1A12}
.cues{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.timer{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px;background:var(--accent-soft);border-radius:var(--r)}
.timer .t{font-family:var(--display);font-size:3.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.checklist button{width:100%;display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink);min-height:64px}
.checklist .box{flex:none;width:32px;height:32px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800}
.checklist button[aria-pressed="true"]{background:var(--sun-soft);border-color:var(--sun)}
.checklist button[aria-pressed="true"] .box{background:var(--sun);border-color:var(--sun);color:#1B1A12}
.checklist .amt{display:block;color:var(--muted);font-size:.95rem}
.navrow{display:grid;grid-template-columns:1fr 2fr;gap:10px;position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg)}
/* Rating */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rate{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--display);font-size:1.5rem;font-weight:800;position:relative}
.rate::after{content:"";position:absolute;left:10px;right:10px;bottom:7px;height:5px;border-radius:3px;background:var(--zc)}
.rate[aria-pressed="true"]{background:var(--zc);border-color:var(--zc);color:#fff}
.zones{display:flex;flex-direction:column;gap:8px}
.zone{display:grid;grid-template-columns:14px auto 1fr;gap:10px;align-items:start;font-size:.95rem}
.zone i{width:14px;height:14px;border-radius:4px;margin-top:5px;background:var(--zc)}
.zone b{white-space:nowrap}
.verdict{border-left:6px solid var(--zc);background:var(--surface);border-radius:12px;padding:14px 16px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn button{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:1.05rem}
.yn button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
textarea{font:inherit;width:100%;min-height:90px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:12px;box-sizing:border-box}
select,input[type=number]{font:inherit;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;box-sizing:border-box}
/* Progress */
.grid12{display:grid;grid-template-columns:auto repeat(4,1fr);gap:6px;align-items:center;font-size:.9rem}
.cell{height:30px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-weight:700;color:#fff;font-size:.85rem}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--zc)}
.z-easy{--zc:var(--z-easy)} .z-right{--zc:var(--z-right)} .z-hard{--zc:var(--z-hard)} .z-max{--zc:var(--z-max)}
.big-done{font-family:var(--display);font-size:3rem;font-weight:800;color:var(--accent);line-height:1.1;align-self:flex-start;background:linear-gradient(transparent 55%,var(--sun) 55%,var(--sun) 90%,transparent 90%);padding:0 6px}
.fade{animation:fade .25s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.rail i{transition:none}}
</style>
</head>

/* ---------- Week math ---------- */
const phaseOf=w=>w<=4?0:w<=8?1:2;
const weekKind=w=>{const p=(w-1)%4; return w===12?"show":["learn","more","extra","recover"][p];};
const WEEK_LABEL={learn:"Learning week",more:"A little more",extra:"Extra set week",recover:"Recovery week",show:"Show-off week"};
const WEEK_HINT={learn:"New moves this week. Go slowly and learn the form.",more:"Two more reps per set, or 5 seconds longer on holds.",extra:"A third set on the first three exercises.",recover:"An easier week so your muscles can catch up. Focus on perfect form.",show:"Your last week. Notice how much stronger you are than in week 1."};
function dose(ex,w,i){
  const kind=weekKind(w); const add=(kind==="more"||kind==="extra");
  let a=ex.a+(add?(ex.k==="sec"?5:2):0);
  let sets=(kind==="extra"&&i<3&&!ex.fin)?3:2;
  const unit=ex.k==="sec"?"sec":ex.k==="steps"?"steps":"reps";
  return {sets,a,unit,x:ex.x};
}
function workoutFor(w,d){return PHASES[phaseOf(w)].days[d-1];}

/* ---------- State + saving ---------- */
const KEY="strong-at-home-v1";
const fresh=()=>({week:1,day:1,cycle:1,log:[],review:false,done:false,checks:{},updatedAt:0});

try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}
let remote=null, writing=false, queued=false;
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  pushRemote();
}
async function pushRemote(){
  if(!remote) return; if(writing){queued=true;return;}
  writing=true;
  try{await remote.set({state:JSON.stringify(S),updatedAt:S.updatedAt});}catch(e){}
  writing=false; if(queued){queued=false;pushRemote();}
}

function myCode(){
  const params=new URLSearchParams(location.search);
  let code=params.get("u");
  if(code&&/^[a-z0-9]{20,64}$/.test(code)){try{localStorage.setItem(KEY+"-code",code);}catch(e){} return code;}
  try{code=localStorage.getItem(KEY+"-code");}catch(e){}
  if(!code){const a="abcdefghijklmnopqrstuvwxyz0123456789",r=crypto.getRandomValues(new Uint8Array(24));code=Array.from(r,x=>a[x%36]).join("");try{localStorage.setItem(KEY+"-code",code);}catch(e){}}
  params.set("u",code); history.replaceState(null,"",location.pathname+"?"+params.toString());
  return code;
}
(async()=>{
  try{

function stepsFor(){const wo=workoutFor(S.week,S.day);return ["warmup",...wo.ex.map((_,i)=>i),"cooldown","rate"];}
function workoutShell(inner,stepIdx,total,label){

}
function navRow(backLabel,nextLabel){return `<div class="navrow"><button class="btn btn-secondary" data-act="back">${backLabel}</button><button class="btn btn-primary" data-act="next">${nextLabel}</button></div>`;}

function workoutStep(){
  const steps=stepsFor(), i=view.step, st=steps[i], wo=workoutFor(S.week,S.day), total=steps.length, ph=phaseOf(S.week);
  const label=`Step ${i+1} of ${total}`;
  if(st==="warmup"){
    const items=WARMUP.map((m,k)=>{const name=Array.isArray(m[0])?m[0][ph]:m[0];const on=!!view.chk["w"+k];
      return `<li><button aria-pressed="${on}" data-chk="w${k}"><span class="box">${on?"✓":""}</span><span><b>${esc(name)}</b><span class="amt">${esc(m[1][ph])}</span></span></button></li>`}).join("");
    return workoutShell(`<span class="eyebrow">Warmup · about 7 minutes</span><h2>Wake up your body</h2><p class="muted">Tap each one as you finish it.</p><ul class="checklist">${items}</ul>${navRow("Home","Start exercises")}`,i,total,label);
  }
  if(st==="cooldown"){
    const items=COOLDOWN.map((m,k)=>{const on=!!view.chk["c"+k];return `<li><button aria-pressed="${on}" data-chk="c${k}"><span class="box">${on?"✓":""}</span><span><b>${esc(m[0])}</b><span class="amt">${esc(m[1])}</span></span></button></li>`}).join("");
    return workoutShell(`<span class="eyebrow">Cooldown · 3 minutes</span><h2>Stretch it out</h2><p class="muted">Slow breaths. Nothing should hurt.</p><ul class="checklist">${items}</ul>${navRow("Back","I'm finished")}`,i,total,label);
  }
  if(st==="rate") return rateScreen(i,total);
  const ex=wo.ex[st], ds=dose(ex,S.week,st), cue=CUES[ex.cue]||[];
  const tips=cue.slice(0,-1), q=cue[cue.length-1]||ex.n;
  const setBtns=Array.from({length:ds.sets},(_,k)=>{const on=!!view.chk[`s${st}-${k}`];return `<button class="set" aria-pressed="${on}" data-chk="s${st}-${k}" aria-label="Set ${k+1}${on?" done":""}">${on?"✓":"Set "+(k+1)}</button>`}).join("");

  return workoutShell(`${firstBase}${firstRetest}
    <span class="eyebrow">${ex.fin?"Finisher · feel the burn":"Exercise "+exNum+" of "+(exTotal-1)}</span>
    <h2 class="ex-name">${esc(ex.n)}</h2>
    <div class="chips"><span class="chip">${esc(ex.eq)}</span></div>
    <div class="dose"><b>${ds.sets} × ${ds.a}</b><span style="font-size:1.2rem;font-weight:700">${ds.unit}${ds.x?" "+esc(ds.x):""}</span></div>
    <div class="stack" style="gap:8px"><span class="eyebrow">Count it slowly</span><div class="counts">${ex.c.split(", ").map(c=>`<span class="count">${esc(c)}</span>`).join("")}</div></div>
    ${isTimed?`<div class="timer"><span class="t" id="tdisp">${ds.a}</span><button class="btn btn-primary" data-act="timer" data-sec="${ds.a}" style="max-width:280px">Start ${ds.a}-second timer</button></div>`:""}
    <div class="stack" style="gap:8px"><span class="eyebrow">Tap a circle after each set · rest 30–45 seconds between</span><div class="sets">${setBtns}</div></div>
    <div class="card stack" style="gap:12px"><h3>How to do it</h3><ul class="cues">${tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
    <a class="btn btn-secondary" href="${yt(q)}" target="_blank" rel="noopener">▶ Watch how on YouTube</a></div>
    ${navRow("Back",st===exTotal-1?"On to cooldown":"Next exercise")}`,i,total,label);

   <section class="card stack"><h3>Change where I am</h3><p class="muted">Use this if you need to go back a week after time off, or if the app is on a new phone.</p>
     <div class="row"><select id="selW" aria-label="Week">${wkOpts}</select><select id="selD" aria-label="Workout">${dOpts}</select></div>
     <button class="btn btn-secondary" data-act="setPlace">Go to this workout</button></section>
  </div>`;
}

function help(){
  return `<div class="stack fade">
   <header class="top"><button class="iconbtn" data-go="home">‹ Home</button><span class="brand">How it works</span></header>
   <section class="card stack"><h3>Your week</h3><p>Strength workouts on <b>Monday, Tuesday, Thursday and Friday</b>, about 35 minutes each. Keep walking every day. The home screen always shows your next workout, so you never have to figure it out.</p></section>
   <section class="card stack"><h3>Count slowly</h3><p>Each exercise shows counts like <span class="count">3 down</span> <span class="count">1 hold</span> <span class="count">2 up</span>. Counting slowly makes light weights feel heavy. That's where the strength comes from.</p></section>
   <section class="card stack"><h3>Rate each workout</h3><p>When you finish, you'll pick a number from 1 to 10 for how hard it felt. Aim for <b>6 or 7</b>: the last couple of reps are hard, but your form stays good.</p>
     <div class="zones">${ZONES.map(z=>`<div class="zone ${z.z}"><i></i><b>${z.r} ${z.t}</b><span class="muted">${z.d}</span></div>`).join("")}</div></section>
   <section class="card stack"><h3>Moving forward</h3><p>After all 4 workouts in a week, the app looks at your ratings. If everything felt 7 or under with no pain, you move up a week. If something felt 8 or more, or hurt, it suggests repeating the week. Repeating is part of the plan, not a step back.</p></section>
   <section class="card stack"><h3>Stay safe</h3><p>Burning muscles are good. Sharp or joint pain means stop that exercise. Keep breathing during holds. If an arm, hand or your chest swells or feels heavy, pause arm exercises and call your care team.</p></section>
   <section class="card stack"><h3>Add it to your iPhone</h3><p>In Safari, tap the Share button (the square with the arrow), then <b>Add to Home Screen</b>. It will open like an app.</p></section>
  </div>`;
}

function resetScreen(){
  return `<div class="stack fade" style="padding-top:28px">
   <span class="eyebrow">Fresh start</span>
   <h1>Start the program fresh?</h1>
   <p>This clears your practice workouts and ratings and takes you back to Week 1, Workout 1. Your program and exercises stay the same.</p>
   <button class="btn btn-primary" data-act="resetYes">Yes, start fresh</button>
   <button class="btn btn-secondary" data-act="resetNo">No, keep my progress</button></div>`;
}
function render(){
  let html;
  switch(view.name){
    case "workout": html=workoutStep(); break;
    case "saved": html=afterSave(); break;
    case "progress": html=progress(); break;
    case "help": html=help(); break;
    case "reset": html=resetScreen(); break;
    default: html=home();
  }
  $app.innerHTML=html;
}

/* ---------- Actions ---------- */
$app.addEventListener("click",ev=>{
  const b=ev.target.closest("button,a"); if(!b) return;
  if(b.dataset.go){go({name:b.dataset.go});keepAwake(false);return;}
  if(b.dataset.chk){view.chk[b.dataset.chk]=!view.chk[b.dataset.chk]; const y=window.scrollY; render(); window.scrollTo(0,y); return;}
  if(b.dataset.rate){view.rating=+b.dataset.rate; keepNote(); const y=window.scrollY; render(); window.scrollTo(0,y); return;}
  if(b.dataset.pain){view.pain=b.dataset.pain; keepNote(); const y=window.scrollY; render(); window.scrollTo(0,y); return;}
  const a=b.dataset.act; if(!a) return;
  if(a==="start"){view={name:"workout",step:0,chk:{}}; render(); window.scrollTo(0,0); keepAwake(true); return;}
  if(a==="exit"){go({name:"home"});keepAwake(false);return;}
  if(a==="next"){stopTimer(); view.step=Math.min(view.step+1,stepsFor().length-1); render(); window.scrollTo(0,0); return;}
  if(a==="back"){stopTimer(); keepNote(); if(view.step===0){go({name:"home"});keepAwake(false);} else {view.step--; render(); window.scrollTo(0,0);} return;}
  if(a==="timer"){startTimer(+b.dataset.sec,b); return;}
  if(a==="saveRating"){
    if(!view.rating||!view.pain) return; keepNote();
    if(!S.reps) S.reps={};
    const e={w:S.week,d:S.day,c:S.cycle,rep:S.reps[S.week]||0,r:view.rating,pain:view.pain,note:(view.note||"").trim(),date:todayStr()};
    S.log.push(e);
    if(S.day<4) S.day++; else S.review=true;
    save(); keepAwake(false); go({name:"saved",entry:e}); return;
  }
  if(a==="advance"){S.review=false; if(S.week===12){S.done=true;} else {S.week++; S.day=1;} save(); go({name:"home"}); return;}
  if(a==="repeat"){S.review=false; S.day=1; if(!S.reps) S.reps={}; S.reps[S.week]=(S.reps[S.week]||0)+1; save(); go({name:"home"}); return;}
  if(a==="newCycle"){S.done=false; S.cycle++; S.week=5; S.day=1; S.reps={}; save(); go({name:"home"}); return;}
  if(a==="saveChecks"){const v1=document.getElementById("c1").value,v2=document.getElementById("c12").value; S.checks={start:v1===""?null:+v1,end:v2===""?null:+v2}; save(); b.textContent="Saved"; return;}
  if(a==="resetYes"){S=fresh(); save(); go({name:"home"}); return;}
  if(a==="resetNo"){go({name:"home"}); return;}
  if(a==="setPlace"){S.week=+document.getElementById("selW").value; S.day=+document.getElementById("selD").value; S.review=false; S.done=false; if(!S.reps) S.reps={}; S.reps[S.week]=(S.reps[S.week]||0)+1; save(); go({name:"home"}); return;}
});
function keepNote(){const t=document.getElementById("note"); if(t) view.note=t.value;}
function startTimer(sec,btn){
  stopTimer(); let left=sec; const disp=document.getElementById("tdisp");
  btn.textContent="Timer running…"; btn.disabled=true;
  timerInt=setInterval(()=>{left--; if(disp) disp.textContent=left;
    if(left<=0){stopTimer(); if(disp) disp.textContent="Done!"; btn.disabled=false; btn.textContent="Start again";}},1000);
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&view.name==="workout") keepAwake(true); else wakeLock=null;});
{const p=new URLSearchParams(location.search); if(p.get("reset")==="1"){view={name:"reset"}; p.delete("reset"); history.replaceState(null,"",location.pathname+(p.toString()?"?"+p.toString():""));}}
render();
</script>
</body>
</html>
